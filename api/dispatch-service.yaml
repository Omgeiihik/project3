openapi: 3.1.0
info:
  title: dispatch-service
  version: 1.0.0
paths:
  /internal/v1/dispatch/assign:
    post:
      tags: [internal]
      summary: Назначить водителя и ТС на заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, requiredCapacityKg]
              properties:
                orderId: { type: string, format: uuid }
                requiredCapacityKg: { type: number }
      responses:
        '200':
          description: Назначение выполнено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '409':
          description: Нет доступных ресурсов
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /internal/v1/dispatch/available:
    get:
      tags: [internal]
      summary: Получить список доступных ТС
      parameters:
        - in: query
          name: minCapacityKg
          schema: { type: number }
      responses:
        '200':
          description: Список доступных ТС
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
components:
  schemas:
    Assignment:
      type: object
      properties:
        assignmentId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        plateNumber: { type: string }
        capacityKg: { type: number }
        vehicleType: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }