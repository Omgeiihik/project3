openapi: 3.1.0
info:
  title: settlement-service
  version: 1.0.0
paths:
  /internal/v1/invoices:
    post:
      tags: [internal]
      summary: Выставить счёт по заказу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amount, currency]
              properties:
                orderId: { type: string, format: uuid }
                amount: { type: number }
                currency: { type: string }
      responses:
        '201':
          description: Счёт создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
  /internal/v1/payments/webhook:
    post:
      tags: [internal]
      summary: Webhook от платёжного шлюза
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, status]
              properties:
                invoiceId: { type: string, format: uuid }
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        '200':
          description: Обработано
components:
  schemas:
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PAID, OVERDUE, CANCELLED] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }